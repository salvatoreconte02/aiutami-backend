services:
  db:
    image: postgres:16
    container_name: aiutami-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7
    container_name: aiutami-redis
    restart: always

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: aiutami-web
    env_file:
      - .env
    environment:
      - DJANGO_DEBUG=0
      - AIOICE_ICE_PORT_MIN=10000
      - AIOICE_ICE_PORT_MAX=10050
    ports:
      # WebRTC media (RTP/RTCP) — devono stare esposti direttamente
      - "10000-10050:10000-10050/udp"
    volumes:
      - staticfiles:/app/staticfiles
    depends_on:
      - db
      - redis
    restart: always

  nginx:
    image: nginx:alpine
    container_name: aiutami-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles:/app/staticfiles:ro
    depends_on:
      - web
    restart: always

volumes:
  pgdata:
  staticfiles:
