version: "3.9"

services:
  db:
    image: postgres:16
    container_name: aiutami-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiutami}
      POSTGRES_USER: ${POSTGRES_USER:-aiutami}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiutami}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: aiutami-redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: aiutami-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  pgdata: