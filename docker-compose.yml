version: "3.9"

services:
  db:
    image: postgres:16
    container_name: aiutami-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiutami}
      POSTGRES_USER: ${POSTGRES_USER:-aiutami}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiutami}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: aiutami-redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: aiutami-web
    command: daphne -b 0.0.0.0 -p 8000 aiutami.asgi:application
    volumes:
      - .:/app
    ports:
      # HTTP / WebSocket signaling
      - "8000:8000/tcp"

      # WebRTC media (RTP/RTCP via aiortc)
      - "10000-20000:10000-20000/udp"
    env_file:
      - .env
    environment:
      # Limiti espliciti per aiortc / aioice
      - AIOICE_ICE_PORT_MIN=10000
      - AIOICE_ICE_PORT_MAX=20000
    depends_on:
      - db
      - redis

volumes:
  pgdata: